name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RatEye.sln

      - name: Build
        run: dotnet build RatEye.sln -c Release --no-restore

      - name: Test
        run: dotnet test RatEye.sln -c Release --no-build --no-restore
