name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RatEye.sln

      - name: Build Debug
        run: dotnet build RatEye.sln -c Debug --no-restore

      - name: Build Release
        run: dotnet build RatEye.sln -c Release --no-restore

      - name: Test
        run: dotnet test RatEye.sln -c Release --no-build --no-restore
